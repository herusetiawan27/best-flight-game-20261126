<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Strait Run — Seaplane Ring Flight</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a1622; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: monospace; color: #cfe8ff; min-height: 100vh; }
  #wrap { width: min(100vw, 177.78vh); }
  canvas { width: 100%; height: auto; display: block; background: #7fb6d9;
           box-shadow: 0 8px 44px rgba(0,0,0,0.55); border-radius: 6px; }
  footer { text-align: center; font-size: 13px; padding: 8px 4px; color: #9fc6dd; }
  body.shot footer { display: none; }
  body.shot { justify-content: flex-start; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <footer>Golden Strait Run &mdash; Arrows / A D: pitch &amp; roll &middot; W / S: throttle &middot; Mouse: steer &middot; R: restart &middot; P: pause &middot; M: mute</footer>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
